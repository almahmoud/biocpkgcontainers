name: Build shard

# Build one shard of packages for one variant. Dispatched by dispatch.yml, which
# splits the branch's package list into shards small enough for a single matrix
# (GitHub caps a workflow run at 256 jobs).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Bioconductor branch, used as the image tag
        type: string
        required: true
      variant:
        description: bioconductor or bioc2u
        type: string
        required: true
      packages:
        description: JSON array of package names to build
        type: string
        required: true
      shard:
        description: Shard label, for run naming only
        type: string
        default: "1/1"
      base_image:
        description: Override the base image
        type: string
        default: ""
      max_parallel:
        description: Concurrent builds within this shard
        type: string
        default: "16"
      strict:
        description: Fail a build if any requested package does not install
        type: boolean
        default: true
      push:
        description: Push images to the registry
        type: boolean
        default: true

run-name: "${{ inputs.variant }} ${{ inputs.branch }} shard ${{ inputs.shard }}"

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      base_image: ${{ steps.resolve.outputs.base_image }}
      packages: ${{ steps.resolve.outputs.packages }}
      count: ${{ steps.resolve.outputs.count }}
    steps:
      - name: Resolve base image and validate the shard
        id: resolve
        env:
          VARIANT: ${{ inputs.variant }}
          BRANCH: ${{ inputs.branch }}
          OVERRIDE: ${{ inputs.base_image }}
          PACKAGES: ${{ inputs.packages }}
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            base="$OVERRIDE"
          else
            case "$VARIANT" in
              bioconductor) base="ghcr.io/bioconductor/bioconductor:${BRANCH}" ;;
              # bioc2u-user is not branch-tagged; :noble tracks current devel.
              # Pin with base_image (e.g. ...:noble-bioc-3.23) to freeze it.
              bioc2u)       base="ghcr.io/bioconductor/bioc2u-user:noble" ;;
              *) echo "::error::variant must be 'bioconductor' or 'bioc2u', got '$VARIANT'"; exit 1 ;;
            esac
          fi
          count=$(printf '%s' "$PACKAGES" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "::error::shard contains no packages"; exit 1
          fi
          # One matrix job per package, plus this job, against the 256 cap.
          if [ "$count" -gt 255 ]; then
            echo "::error::shard has ${count} packages; a run supports at most 255 here"; exit 1
          fi
          echo "base_image=${base}" >> "$GITHUB_OUTPUT"
          echo "packages=${PACKAGES}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "### shard ${SHARD} — ${count} packages on \`${base}\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        package: ${{ fromJSON(needs.setup.outputs.packages) }}
    # Keep two shards from racing on the same tag if a package is dispatched twice.
    concurrency:
      group: image-${{ inputs.variant }}-${{ inputs.branch }}-${{ matrix.package }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and push
        uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          branch: ${{ inputs.branch }}
          variant: ${{ inputs.variant }}
          base-image: ${{ needs.setup.outputs.base_image }}
          manifest-dir: manifests/${{ inputs.branch }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          strict: ${{ inputs.strict }}
          push: ${{ inputs.push }}

      - name: Record failure
        if: failure()
        env:
          PACKAGE: ${{ matrix.package }}
        run: printf '%s\n' "$PACKAGE" > failure.txt

      - name: Upload failure marker
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-${{ inputs.variant }}-${{ matrix.package }}
          path: failure.txt
          retention-days: 14

  report:
    needs: [setup, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect failures
        id: collect
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: failed-${{ inputs.variant }}-*
          path: failures
          merge-multiple: false

      - name: Summarise
        env:
          TOTAL: ${{ needs.setup.outputs.count }}
          VARIANT: ${{ inputs.variant }}
          BRANCH: ${{ inputs.branch }}
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          total="$TOTAL"
          failed=$(find failures -name failure.txt 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "## ${VARIANT} / ${BRANCH} / shard ${SHARD}"
            echo
            echo "built ${total}, failed ${failed}"
            if [ "$failed" -gt 0 ]; then
              echo
              echo '<details><summary>failed packages</summary>'
              echo
              cat $(find failures -name failure.txt) | sort | sed 's/^/- /'
              echo
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
